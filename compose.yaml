# ══════════════════════════════════════════════════════════════
# Sentinel — Docker Compose (NEXORA 2026)
# Usage: docker compose up --build
# ══════════════════════════════════════════════════════════════

services:
  sentinel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sentinel
    ports:
      - "8080:8080"
    environment:
      - SENTINEL_DATA_DIR=/app/data
      - SENTINEL_VISITS_PER_WEEK=15
      - SENTINEL_BASELINE_WINDOW_DAYS=28
      - SENTINEL_RECENT_WINDOW_DAYS=7
      - SENTINEL_SCORED_WEEKS=8
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
